phase_0_intake:
  label: "Phase 0: Intake"
  prompt: "references/prompts/intake.md"
  gate: "intake"
  outputs:
    - "ASSUMPTIONS.md"
    - "artifacts/00-brief.md"
    - "artifacts/01-market-map.md"
    - "artifacts/02-story-engine.md"
  next: "Phase 1: Foundation"

phase_1_foundation:
  label: "Phase 1: Foundation"
  prompt: "references/prompts/foundation.md"
  gate: "foundation"
  outputs:
    - "artifacts/03-characters.md"
    - "artifacts/04-theme.md"
    - "artifacts/06-emotional-curve.md"
  genre_pack_outputs: "Additional artifacts may be declared by knowledge/genre-packs/<genre>.md when a pack matches project.genre. Never required when no pack matches. Documentation only - not read by runner/filesystem.py."
  next: "Phase 2: Architecture"

phase_2_architecture:
  label: "Phase 2: Architecture"
  prompt: "references/prompts/architecture.md"
  gate: "architecture"
  outputs:
    - "artifacts/05-outline.md"
    - "artifacts/07-opening-strategy.md"
  next: "Phase 3: Drafting"

phase_3_drafting:
  label: "Phase 3: Drafting"
  prompt: "references/prompts/drafting.md"
  gate: "drafting"
  outputs:
    - "manuscript/chapters"
  checks:
    - "timeline"
    - "lint"
    - "macro"
    - "texture"
    - "voice_lexicon"
    - "chapter_order"
    - "wordcount:0.85:1.25"
    - "structure_variety"
  next: "Phase 4: Adversarial Audit"

phase_4_adversarial_audit:
  label: "Phase 4: Adversarial Audit"
  prompt: "references/prompts/adversarial-audit.md"
  gate: "adversarial_audit"
  outputs:
    - "artifacts/08-adversarial-audit.md"
  checks:
    - "timeline:required"
    - "lint"
    - "macro"
    - "texture"
    - "voice_lexicon"
    - "chapter_order"
    - "wordcount:0.85:1.25"
    - "structure_variety"
    - "dynamic_range"
  next: "Phase 5: Final Score"

phase_5_final_score:
  label: "Phase 5: Final Score"
  prompt: "references/scoring/genesis-score-codex.md"
  gate: "final_score"
  outputs:
    - "artifacts/09-genesis-score-codex.md"
  next: "Phase 6: Editorial Package"

phase_6_editorial_package:
  label: "Phase 6: Editorial Package"
  prompt: "references/prompts/editorial-package.md"
  gate: "editorial_package"
  outputs:
    - "artifacts/10-editorial-package.md"
  next: "Phase 7: Production"

phase_7_production:
  label: "Phase 7: Production"
  prompt: "references/prompts/production.md"
  gate: "production"
  outputs:
    - "BOOK.yaml"
    - "manuscript/full-manuscript.md"
    - "delivery/production/pre-publication-checklist.md"
    - "delivery/epub"
  checks:
    - "book_meta"
    - "chapter_order"
    - "proof"
    - "wordcount:0.85:1.25"
    - "human_pass"
    - "epub"
  next: ""
